[config.site]
title = "Panchamfolio"
description = "A personal corner of the internet by Pancham Barman — a developer sharing projects, blog posts, notes, and ideas. Built for lightweight organization, seamless reading, and developer-friendly exploration."
pageTitle = "Panchamfolio | Pancham Barman — Developer, Writer & Builder"
pageDescription = "Panchamfolio is Pancham Barman's personal digital space — a hub for projects, writing, notes, and open-source work. Navigate his world, explore his story, and discover everything in one place."
repository = "https://github.com/pancham555/navfolio"
footerNote = "Released as an open-source starter."

[config.vibe]
showTrail = true

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-vivid"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.comments]
enabled = true
provider = "giscus"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.blog]
postsPerPage = 6

[config.comments.giscus]
repo = "dodolalorc/astro-navfolio"
repo_id = "R_kgDOSaQejw"
category = "Announcements"
category_id = "DIC_kwDOSaQej84C9di9"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
# lang = "zh-CN"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
# lang = "zh-CN"
lang = "en"
dark = "html.dark"
pageview = true
comment = true


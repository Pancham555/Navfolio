# .github/workflows/rename-vibe.yml
on:
  push:
    paths:
      - 'src/content/vibe/**'

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend date if missing
        run: |
          for f in src/content/vibe/*.mdx; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-'; then
              date_prefix=$(date +%Y-%m-%d)
              git mv "$f" "src/content/vibe/${date_prefix}-${base}"
            fi
          done
      - name: Commit renames
        run: |
          git config user.name "github-actions"
          git config user.email "panchamb63@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: add date prefix to vibe files"
          git push
